# search configuration
#
# Location: ~/.config/search/config.toml (Linux)
#           ~/Library/Application Support/search/config.toml (macOS)
# `search config path` prints it. The file is created with mode 0600.
#
# Environment variables win over this file. For each provider, in order:
#   1. <PROVIDER>_API_KEY      e.g. BRAVE_API_KEY, SERPER_API_KEY
#   2. SEARCH_KEYS_<PROVIDER>  e.g. SEARCH_KEYS_BRAVE, SEARCH_KEYS_SERPER
#   3. this file
#
# Set keys without leaving them in shell history:
#   echo "$KEY" | search config set keys.brave -
#
# Fallback keys: a list is tried in order, the next key whenever one is
# refused, out of credit or rate limited (exa = ["k1", "k2"]). In the
# environment: EXA_API_KEY, then EXA_API_KEY_2, _3, ... (these replace the
# file's list), or SEARCH_KEYS_EXA='[k1, k2]'.

[keys]
serper = ""
exa = ""
jina = ""
brave = ""
linkup = ""
parallel = ""
tavily = ""
perplexity = ""
serpapi = ""
xai = ""
firecrawl = ""
browserless = ""

[settings]
count = 10            # results per search when -c is not given

[metasearch]
# Written by `search login`; METASEARCH_TOKEN or SEARCH_METASEARCH_TOKEN override it.
token = ""
# Another host for login and hosted calls (default https://metasearch.sh).
# METASEARCH_URL overrides it; any other host needs METASEARCH_ALLOW_INSECURE_HOST=1.
# url = ""
# metasearch.sh picks the engines of a hosted search itself (one call per
# search); name engines with -p to choose them.
