[package]
name = "agent-search"
version = "0.9.0"
edition = "2021"
description = "Unified multi-provider search CLI for AI agents — 13 providers, 13 modes, email verification, one binary"
license = "MIT"
repository = "https://github.com/paperfoot/search-cli"
homepage = "https://github.com/paperfoot/search-cli"
documentation = "https://github.com/paperfoot/search-cli#readme"
keywords = ["search", "cli", "ai-agent", "meta-search", "web-search"]
categories = ["command-line-utilities", "web-programming"]
readme = "README.md"

[[bin]]
name = "search"
path = "src/main.rs"

[features]
# The stealth provider needs wreq (BoringSSL), which doesn't link on Linux —
# build with --no-default-features there; the extract chain starts at jina.
default = ["stealth"]
stealth = ["dep:wreq", "dep:wreq-util"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
# Features spelled out: http2 used to arrive only by accident through
# self_update; gzip shrinks fetched pages (flate2 is already in the tree).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
figment = { version = "0.10", features = ["toml", "env"] }
comfy-table = "7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
async-trait = "0.1"
owo-colors = "4"
indicatif = "0.17"
# No default features: they pull native-tls, a second TLS stack and an
# OpenSSL link on Linux.
self_update = { version = "0.43", default-features = false, features = ["reqwest", "rustls", "archive-tar", "compression-flate2"] }
backon = "1"
url = "2.5.8"
mimalloc = "0.1.48"
simd-json = "0.17.0"
wreq = { version = "=6.0.0-rc.28", features = ["json", "cookies"], optional = true }
wreq-util = { version = "=3.0.0-rc.11", optional = true }
hickory-resolver = { version = "0.26", features = ["tokio"] }
readability = "0.3"
# Page module: article extraction to markdown (dom_smoothie) and whole-page
# markdown on the same parser (dom_query), charset decoding (encoding_rs).
dom_smoothie = "0.19"
dom_query = { version = "0.29", default-features = false, features = ["markdown"] }
encoding_rs = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
