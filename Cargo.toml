[package]
name = "agent-search"
version = "0.12.1"
edition = "2021"
description = "Web search CLI for AI agents: ten search engines plus TikTok, YouTube, X and Reddit, auto routing, rank fusion, page extraction and the cost of every search"
license = "MIT"
repository = "https://github.com/paperfoot/search-cli"
homepage = "https://github.com/paperfoot/search-cli"
documentation = "https://github.com/paperfoot/search-cli#readme"
keywords = ["search", "cli", "ai-agent", "meta-search", "web-search"]
categories = ["command-line-utilities", "web-programming"]
readme = "README.md"

[[bin]]
name = "search"
path = "src/main.rs"

[features]
# The stealth rung uses wreq (BoringSSL). On Linux, wreq's prefix-symbols
# feature (below) keeps BoringSSL's symbols apart from any OpenSSL in the
# link; --no-default-features drops it, and the chain starts at direct.
default = ["stealth"]
stealth = ["dep:wreq", "dep:wreq-util", "dep:http-body-util"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
# Features spelled out: http2 used to arrive only by accident through
# self_update; gzip shrinks fetched pages (flate2 is already in the tree).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
figment = { version = "0.10", features = ["toml", "env"] }
comfy-table = "7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
async-trait = "0.1"
indicatif = "0.17"
# No default features: they pull native-tls, a second TLS stack and an
# OpenSSL link on Linux.
self_update = { version = "0.43", default-features = false, features = ["reqwest", "rustls", "archive-tar", "compression-flate2"] }
backon = "1"
url = "2.5.8"
mimalloc = "0.1.48"
# Chrome advertises gzip, br and zstd; without the decoders a compressed
# page reads as binary.
wreq = { version = "=6.0.0-rc.31", features = ["cookies", "gzip", "brotli", "zstd", "deflate"], optional = true }
wreq-util = { version = "=3.0.0-rc.14", optional = true }
# Streams the stealth body under the 5 MB cap (already in the tree via wreq).
http-body-util = { version = "0.1", optional = true }
hickory-resolver = { version = "0.26", features = ["tokio"] }
# Page module: article extraction to markdown (dom_smoothie) and whole-page
# markdown on the same parser (dom_query), charset decoding (encoding_rs).
dom_smoothie = "0.19"
dom_query = { version = "0.29", default-features = false, features = ["markdown"] }
encoding_rs = "0.8"
uuid = { version = "1", features = ["v4"] }

# BoringSSL and OpenSSL export the same symbol names; prefixing BoringSSL's
# avoids the clash on Linux (wreq README, rc.29 onwards).
[target.'cfg(target_os = "linux")'.dependencies]
wreq = { version = "=6.0.0-rc.31", features = ["prefix-symbols"], optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
