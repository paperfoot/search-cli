name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # macOS matches release.yml — rquest/boring-sys links cleanly here, unlike
    # Linux CI. Keeps the gate on the same platform we ship.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  # Linux build without the stealth feature (wreq/BoringSSL doesn't link on
  # Linux runners) — proves the container/agent-fleet build stays green.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test (no stealth)
        run: cargo test --locked --no-default-features

      # The search-cli plugin ships a byte copy of SKILL.md.
      - name: Plugin skill matches SKILL.md
        run: diff SKILL.md plugins/search-cli/skills/search/SKILL.md

  # Linux build WITH default features (stealth: wreq + BoringSSL), on both
  # arches release.yml ships. Required: Linux release binaries carry stealth
  # (release.yml LINUX_FLAGS is empty), so a red job here means a red release.
  linux-default:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools for BoringSSL
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev perl pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test (default features)
        run: cargo test --locked

  # Advisory + license + source gate. wreq is a pre-release pin inherited
  # from the yanked rquest crate — exactly the dependency class to watch.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources
