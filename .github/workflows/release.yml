name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            flags: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            flags: ""
          # Linux ships without the stealth feature (wreq/BoringSSL doesn't
          # link on Linux runners); the extract chain starts at jina there.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            flags: "--no-default-features"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        # --locked: reproducible release builds from the committed Cargo.lock.
        run: cargo build --release --locked ${{ matrix.flags }} --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../search-${{ matrix.target }}.tar.gz search
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: search-${{ matrix.target }}
          path: search-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # One checksums file per release: install.sh and the Homebrew bump
      # verify against it instead of hand-computing hashes.
      - name: Checksums
        run: sha256sum search-*.tar.gz > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            search-*.tar.gz
            SHA256SUMS
          generate_release_notes: true
