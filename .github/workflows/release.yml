name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Cargo flags for every Linux target. Empty: Linux ships with the stealth
  # feature (wreq/BoringSSL), which ci.yml's linux-default job builds and
  # tests on both Linux arches. "--no-default-features" drops it again.
  LINUX_FLAGS: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            linux: false
          - target: aarch64-apple-darwin
            os: macos-latest
            linux: false
          # Linux targets build natively on matching runners and share
          # LINUX_FLAGS above.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            linux: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            linux: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build tools for BoringSSL
        if: matrix.linux && env.LINUX_FLAGS == ''
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev perl pkg-config

      - name: Build
        # --locked: reproducible release builds from the committed Cargo.lock.
        run: cargo build --release --locked ${{ matrix.linux && env.LINUX_FLAGS || '' }} --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../search-${{ matrix.target }}.tar.gz search
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: search-${{ matrix.target }}
          path: search-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # One checksums file per release: install.sh and the Homebrew bump
      # verify against it instead of hand-computing hashes.
      - name: Checksums
        run: sha256sum search-*.tar.gz > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            search-*.tar.gz
            SHA256SUMS
          generate_release_notes: true
